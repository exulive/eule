<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eule · Notlarım</title>
<link rel="icon" href="eule.png?v=__V__">
<link rel="stylesheet" href="app.css?v=__V__">
<script src="app.js?v=__V__" defer></script>
</head>
<body>
<main id="login" class="card login" hidden>
  <img src="eule.png" alt="" class="logo">
  <h1>Eule</h1>
  <p class="muted">Notlarını görmek için giriş yap.</p>
  <form id="login-form">
    <label>E-posta<input type="email" name="email" autocomplete="username" required></label>
    <label>Şifre<input type="password" name="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" name="remember" checked> Beni hatırla</label>
    <button type="submit">Giriş yap</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="eule.png" alt="" class="logo sm"> Eule</div>
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost">Çıkış</button>
  </header>

  <section class="wrap">
    <form id="add-form" class="add">
      <input name="text" placeholder="Yeni not… (ör. yarın 15:00'te Ayşe'yi ara)" maxlength="2000" autocomplete="off" required>
      <button type="submit">Ekle</button>
    </form>
    <p id="add-reply" class="muted reply" role="status"></p>

    <nav class="tabs" role="tablist">
      <button id="tab-notes" class="tab" role="tab" aria-selected="true">Notlar</button>
      <button id="tab-history" class="tab" role="tab" aria-selected="false">Dikte geçmişi</button>
    </nav>

    <div class="tools">
      <input id="search" type="search" placeholder="Ara…">
      <label class="check" id="show-done-label"><input id="show-done" type="checkbox"> Tamamlananları göster</label>
    </div>

    <div id="groups"></div>
    <p id="empty" class="muted empty" hidden>Henüz not yok. Baykuşa söylediğin her şey burada görünür.</p>
  </section>
</div>

<template id="note-tpl">
  <li class="note">
    <input type="checkbox" class="done" aria-label="Tamamlandı">
    <div class="body">
      <div class="title" contenteditable="plaintext-only" spellcheck="false"></div>
      <div class="meta muted"></div>
    </div>
    <button class="del ghost" title="Sil" aria-label="Sil">×</button>
  </li>
</template>

<template id="history-tpl">
  <li class="note history">
    <time class="clock"></time>
    <div class="body">
      <div class="said"></div>
      <div class="meta muted"></div>
    </div>
    <button class="del ghost" title="Sil" aria-label="Sil">×</button>
  </li>
</template>
</body>
</html>
